name: Tự động cào dữ liệu hàng ngày

on:
  schedule:
    - cron: '0 1,10 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy code từ GitHub
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary requests beautifulsoup4 supabase python-dotenv lxml urllib3 yfinance
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Chạy các file Crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        
        run: |
          python data_pipeline/vn_gold_crawler.py
          python data_pipeline/vn_fuel_crawler.py
          python data_pipeline/market_data.py