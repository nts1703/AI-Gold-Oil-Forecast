name: Tự động cào dữ liệu hàng ngày

on:
  schedule:
    # Chạy vào 08:00 sáng và 17:00 chiều giờ VN (tương ứng 01:00 và 10:00 UTC)
    - cron: '0 1,10 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy code từ GitHub
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 supabase python-dotenv lxml urllib3 sqlalchemy psycopg2-binary yfinance

      - name: Chạy các file Crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python data_pipeline/vn_gold_crawler.py
          python data_pipeline/vn_fuel_crawler.py
          # Nếu có file market_data.py thì chạy thêm dòng này:
          python data_pipeline/market_data.py